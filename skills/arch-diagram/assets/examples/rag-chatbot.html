  --color-rule-2:  oklch(83% 0.011 255);    /* hairline borders */
  --color-muted:   oklch(56% 0.013 255);
  --color-neutral: oklch(46% 0.015 255);    /* neutral edges */
  --color-ink-2:   oklch(34% 0.018 257);
  --color-ink:     oklch(24% 0.020 258);
  --color-accent:  oklch(58% 0.20 256);     /* THE one signal color: primary flow only */
  --color-graphite:oklch(24% 0.018 260);    /* dark tile for white / very light logos */
  /* group palette A — warm vendor (Vercel/Cloudflare/AWS orange…). Retune the hue per vendor. */
  --color-g1: oklch(40% 0.02 258);
  --color-g1-soft: oklch(60% 0.02 258);
  --color-g1-ink: oklch(34% 0.02 258);
  --color-g1-tint: oklch(95% 0.004 258 / .5);
  /* group palette B — accent family (repo / tooling / internal platform) */
  --color-accent-soft: oklch(58% 0.20 256 / .45);
  --color-accent-tint: oklch(97% 0.012 256 / .5);
  /* group palette C — neutral (on-prem, trust zone, "everything else") */
  --color-g3:      oklch(70% 0.01 255);
  --color-g3-tint: oklch(95% 0.004 255 / .6);

  /* FONTS. Geist draws Latin; the Korean faces after it draw only the glyphs Geist lacks, so Latin
     diagrams render identically. Pretendard is named first because it is what build.py embeds and
     what most Korean machines have; Noto Sans KR is the webfont fallback; the OS faces come last.
     The mono stack carries the same Korean tail so a role line like "결제 · webhook" renders the
     Hangul in a predictable face instead of whatever the OS substitutes for `monospace`. */
  --font-kr: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic";
  --font-display: "Geist", var(--font-kr), "Hiragino Sans", "Noto Sans JP", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Geist", var(--font-kr), "Hiragino Sans", "Noto Sans JP", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, var(--font-kr), monospace;

  --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --radius-card: 10px; --radius-tile: 12px;
  /* translucent veil behind node label text: matches paper on the plain canvas, blends into group
     tints instead of punching an off-color rectangle through them */
  --color-veil: oklch(98.5% 0.004 250 / .78);
}
/* Dark variant: data-theme="dark" on <html>. Tiles stay white — brand logos are drawn for light
   grounds. Arrowheads (context-stroke) and legend swatches follow the tokens automatically. */
[data-theme="dark"] {
  color-scheme: dark;
  --color-paper:   oklch(18% 0.012 255);
  --color-paper-2: oklch(22% 0.014 255);
  --color-rule:    oklch(24% 0.013 255);
  --color-rule-2:  oklch(38% 0.018 255);
  --color-muted:   oklch(65% 0.014 255);
  --color-neutral: oklch(72% 0.012 255);
  --color-ink-2:   oklch(85% 0.010 255);
  --color-ink:     oklch(94% 0.008 255);
  --color-accent:  oklch(70% 0.16 256);
  --color-graphite:oklch(31% 0.020 260);
  --color-g1: oklch(75% 0.01 258);
  --color-g1-soft: oklch(55% 0.01 258);
  --color-g1-ink: oklch(88% 0.01 258);
  --color-g1-tint: oklch(26% 0.008 258 / .5);
  --color-accent-soft: oklch(70% 0.16 256 / .5);
  --color-accent-tint: oklch(28% 0.045 256 / .35);
  --color-g3:      oklch(45% 0.01 255);
  --color-g3-tint: oklch(24% 0.006 255 / .6);
  --color-veil: oklch(18% 0.012 255 / .78);
}

/* JetBrains Mono reads cramped at 9.5–11px; open every mono label slightly */
.kicker, .node .role, .el, .legend, .foot { letter-spacing: 0.04em; }
/* Hangul has no mono glyphs: a mono space (0.6em) beside Pretendard syllables reads as a double gap,
   so Korean pages set these labels in the body face at natural spacing */
:lang(ko) .node .role, :lang(ko) .el, :lang(ko) .legend { font-family: var(--font-body); letter-spacing: 0; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { overflow-x: clip; }
body { background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body);
  padding: var(--space-xl) var(--space-lg) var(--space-2xl);
  /* Korean wraps at spaces, never mid-word; Latin tech names may still break at hyphens */
  word-break: keep-all; overflow-wrap: anywhere; }
.page { width: fit-content; max-width: 100%; margin: 0 auto; }

.head { display:grid; grid-template-columns: 1fr auto; gap: var(--space-lg); align-items:end;
  padding-bottom: var(--space-md); border-bottom: 1px solid var(--color-rule-2); margin-bottom: var(--space-lg); }
.kicker { font-family: var(--font-mono); font-size: 11px; color: var(--color-accent); margin-bottom: var(--space-sm); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 4vw, 30px);
  letter-spacing: -0.005em; line-height: 1.25; }
.lede { max-width: 320px; font-size: 12px; line-height: 1.7; color: var(--color-neutral); padding-bottom: 2px; }
@media (max-width: 680px) { .head { grid-template-columns: 1fr; align-items:start; } .lede { max-width:none; } }

/* figure = canvas + legend; render_png.py captures .figure by default so the legend ships with the picture */
.figure { width: fit-content; max-width: 100%; }
.scroller { overflow-x: auto; border: 1px solid var(--color-rule-2); border-radius: var(--radius-card); }
/* CANVAS SIZE: set width/height here AND the svg.edges viewBox — keep the two in sync (check.py verifies) */
.canvas { position: relative; width: 812px; height: 532px; background: var(--color-paper);
  background-image:
    linear-gradient(var(--color-rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--color-rule) 1px, transparent 1px);
  background-size: 24px 24px; background-position: -1px -1px; }

/* GROUPS ------------------------------------------------------------------------------------- */
.group { position:absolute; border-radius: var(--radius-tile); }
/* group labels are names (display font) in the brand's own casing. They sit inside the top-left
   corner so the border stays unbroken; keep edges out of that corner (geometry.md) */
.g-label { position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:6px;
  font-family: var(--font-display); font-size: 12px; font-weight: 600;
  color: var(--color-neutral); white-space: nowrap; }
.g-label img { width: 14px; height: 14px; }
/* group labels sit on the group's tint, not on a white tile: in the dark theme swap in the brand's
   own dark-theme logo (lt/dk pair), or give a mark with black parts a white plate */
.g-label img.dk, .tile img.dk { display:none; }
/* a plain tile stays #fff in both themes, so it keeps the light logo; only tiles that show a dark
   ground (.bare on the canvas, .dark graphite) swap */
[data-theme="dark"] .g-label img.lt, [data-theme="dark"] .tile:is(.bare,.dark) img.lt { display:none; }
[data-theme="dark"] .g-label img.dk, [data-theme="dark"] .tile:is(.bare,.dark) img.dk { display:block; }
[data-theme="dark"] .g-label img.plate { background:#fff; border-radius:3px; padding:2px; width:18px; height:18px; }
.group.ga { border:1.5px solid var(--color-g1); background: var(--color-g1-tint); }
.group.ga-nested { border:1.5px dashed var(--color-g1-soft); }
.group.gb { border:1.5px solid var(--color-accent-soft); background: var(--color-accent-tint); }
.group.gc { border:1.5px solid var(--color-g3); background: var(--color-g3-tint); }
/* trust / security boundary: dashed ink, no fill — "inside here is a different trust level" */
.group.boundary { border:1.5px dashed var(--color-ink-2); background: none; }
.group.ga > .g-label, .group.ga-nested > .g-label { color: var(--color-g1-ink); }
.group.gb > .g-label { color: var(--color-accent); }
.group.gc > .g-label, .group.boundary > .g-label { color: var(--color-ink-2); }
/* vendor-drawn groups: AWS / Google Cloud / Azure follow each vendor's own drawing rules (icons.md) */
.group.aws { border:1.5px solid var(--color-ink); border-radius:0; }
.group.aws > .g-label { top:-1.5px; left:-1.5px; gap:8px; color: var(--color-ink); }
.group.aws > .g-label img { width:30px; height:30px; }
/* AWS groups without the 30px corner icon (subnets, region, AZ) inset their label like every other group */
.group.aws.az > .g-label, .group.aws.region > .g-label, .group.aws.public > .g-label, .group.aws.private > .g-label { top:8px; left:12px; }
.group.aws.region, .group.aws.az { border-color:#00A4A6; border-style:dashed; }
.group.aws.vpc { border-color:#8C4FFF; }
.group.aws.private { border-color:#00A4A6; }
.group.aws.public { border-color:#7AA116; }
.group.gcp { border:1.5px solid #4285F4; border-radius:6px; }
.group.azure { border:1.5px solid #0078D4; border-radius:6px; }
.group.gcp > .g-label, .group.azure > .g-label { gap:8px; color: var(--color-ink); }
.group.gcp > .g-label img, .group.azure > .g-label img { width:20px; height:20px; }
.group.gcp.region, .group.azure.region { border-color: var(--color-rule-2); background: var(--color-paper-2); }
.group.gcp.vpc { border:1.5px dashed var(--color-ink-2); }
.group.gcp.subnet { border:1px dashed var(--color-neutral); }
.group.gcp.zone { border-color:#34A853; }
.group.azure.rg { border:1.5px dashed #0096D7; }
.group.azure.vnet { border:1.5px solid #A4CBFB; }
.group.azure.subnet { border:1px solid #A4CBFB; }
.group.azure.zone { border-color:#FFD965; }

/* NODES -------------------------------------------------------------------------------------- */
/* node = tile + name + role. Widths: default 132 (left = cx-66), wide 172 (left = cx-86),
   xwide 212 (left = cx-106). Korean names run ~1em per syllable: 5 syllables fill a default node,
   so a name of 6+ syllables, or any full service name ("Amazon ElastiCache"), takes `wide`. */
.node { position:absolute; width:132px; text-align:center; }
.node.wide { width:172px; }
.node.xwide { width:212px; }
.tile { width:60px; height:60px; margin:0 auto; border-radius: var(--radius-tile);
  background:#fff; border:1px solid var(--color-rule-2); display:grid; place-items:center;
  box-shadow: 0 1px 2px oklch(24% 0.02 258 / 0.05); transition: border-color .15s cubic-bezier(0.16,1,0.3,1); }
.node:hover .tile { border-color: var(--color-accent); }
.tile img { width:34px; height:34px; object-fit:contain; }
.tile.wide img { width:44px; }                       /* wide-aspect logos */
.tile.dark { background: var(--color-graphite); border-color: var(--color-graphite); }  /* white / light logos */
.tile.bare { background:none; border:none; box-shadow:none; }   /* vendor icons that carry their own square */
.tile.bare img { width:60px; height:60px; }
.tile.bare.res img { width:44px; height:44px; }
/* focal tile: at most ONE per diagram — the component the diagram is about */
.tile.focal { border:1.5px solid var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-tint); }
.tile.bare.focal { border:none; box-shadow: 0 0 0 2px var(--color-accent), 0 0 0 5px var(--color-accent-tint); }
.node .name { font-family: var(--font-display); font-weight:600; font-size:13px; line-height:1.3;
  margin-top: var(--space-sm); letter-spacing:0; }
.node .role { font-family: var(--font-mono); font-size:9.5px; line-height:1.3; color: var(--color-muted); margin-top:2px; }
/* veil behind label spans: crossing edges / grid lines fade behind text; translucent so it blends
   into group tints (a solid paper rectangle looks pasted-on inside a tinted group) */
.node .name span, .node .role span { background: var(--color-veil); backdrop-filter: blur(1.5px);
  padding: 0 var(--space-xs); border-radius: 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

/* EDGES -------------------------------------------------------------------------------------- */
svg.edges { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.e  { stroke: var(--color-accent); stroke-width:1.6; fill:none; }   /* primary flow — one continuous path */
.n  { stroke: var(--color-neutral); stroke-width:1.4; fill:none; }  /* internal / secondary */
path.aws { stroke: var(--color-ink); stroke-width:1.6; fill:none; } /* inside an AWS group: ink + open arrowhead */
.dash { stroke-dasharray:4 5; }                                     /* dev / deploy / async / return */
.el { font-family: var(--font-mono); font-size:10.5px; fill: var(--color-neutral);
  paint-order: stroke; stroke: var(--color-paper); stroke-width:4px; stroke-linejoin:round; }  /* halo */
.el.a { fill: var(--color-accent); }
/* step numbers ①②③ on the primary path when the reading order matters (Korean readers expect them) */
.el.step { font-family: var(--font-display); font-size:12px; font-weight:600; }

/* LEGEND: a horizontal strip under the canvas, never floating inside it ------------------------ */
.legend { display:flex; gap: var(--space-lg); align-items:center; margin-top: var(--space-md);
  padding: 0 var(--space-md) var(--space-sm);   /* PNGs crop to .figure: keep swatches off its edge */
  font-family: var(--font-mono); font-size:10px; color: var(--color-muted); flex-wrap:wrap; }
.legend .sw { display:inline-block; width:30px; vertical-align:middle; margin-right:6px;
  border-top:1.6px solid var(--color-accent); }
.legend .sw.n { border-color: var(--color-neutral); border-top-width:1.4px; }
.legend .sw.dash { border-top-style: dashed; }
.legend .sw.box { width:12px; height:12px; border:1.5px solid var(--color-g1); border-radius:3px; background: var(--color-g1-tint); }
.legend .sw.box.gb { border-color: var(--color-accent-soft); background: var(--color-accent-tint); }
.legend .sw.box.gc { border-color: var(--color-g3); background: var(--color-g3-tint); }
.legend .sw.box.boundary { border-style: dashed; border-color: var(--color-ink-2); background: none; }

/* DELTA (diff.py --annotate): what changed since the base spec ------------------------------ */
.node[data-delta="added"] .tile { box-shadow: 0 0 0 2px oklch(62% 0.17 150), 0 0 0 5px oklch(62% 0.17 150 / .18); }
.node[data-delta="changed"] .tile { box-shadow: 0 0 0 2px oklch(72% 0.17 75), 0 0 0 5px oklch(72% 0.17 75 / .18); }
.node[data-delta="removed"] { opacity: .45; }
.node[data-delta="removed"] .tile { border-style: dashed; }
.node[data-delta="removed"] .name { text-decoration: line-through; }

    <input type="search" data-viewer-find placeholder="노드 찾기 ( / )" aria-label="노드 찾기">
    <button type="button" data-viewer-theme aria-pressed="false">다크 (T)</button>
    <button type="button" data-viewer-clear>초기화 (Esc)</button>
    <span class="hint" data-viewer-hint>노드를 클릭하면 연결이 강조됩니다 · ? 도움말</span>
  </div>
  <aside class="passport" data-viewer-passport hidden aria-live="polite"></aside>

  <div class="foot">
    <span>arch-diagram 예제 · 문서 챗봇</span>
    <span>icons: svgl · made with <a href="https://github.com/janghoesoo1/arch-diagram" target="_blank" rel="noopener">arch-diagram</a></span>
  </div>

</div>

<!-- Viewer runtime: optional, offline, self-contained. The diagram keeps its complete meaning without
     it (print, reduced capability, PNG). It reads the authored graph from the markup: every .node[data-id]
     and every path[data-from][data-to]. Deep links: #focus=<id>[&reach=upstream|downstream], #route=<a>~<b>.
     Keys: click/Enter focus · U/D reach · / find · T theme · Esc clear · ? help. check.py allows exactly
     this one script and rejects any network call inside it. -->
<script data-arch-diagram-viewer>
(function () {
  "use strict";
  var canvas = document.querySelector(".canvas");
  if (!canvas) return;
  var ko = (document.documentElement.lang || "").toLowerCase().indexOf("ko") === 0;
  var T = ko ? { up: "상류", down: "하류", none: "없음", group: "그룹", sources: "근거", note: "메모", copy: "링크 복사", copied: "복사됨",
                 reachUp: "상류 추적", reachDown: "하류 추적", route: "경로", clear: "초기화 (Esc)", theme: "다크 (T)", light: "라이트 (T)",
                 help: "클릭/Enter: 포커스 · U/D: 상류/하류 추적 · R: 두 노드 경로 · /: 찾기 · T: 테마 · Esc: 초기화",
                 findPh: "노드 찾기 ( / )", routeAsk: "경로의 끝 노드를 클릭하세요", noRoute: "작성된 방향 경로가 없습니다" }
            : { up: "upstream", down: "downstream", none: "none", group: "group", sources: "sources", note: "note", copy: "copy link", copied: "copied",
                 reachUp: "trace upstream", reachDown: "trace downstream", route: "route", clear: "clear (Esc)", theme: "dark (T)", light: "light (T)",
                 help: "click/Enter: focus · U/D: reach up/down · R: route between two nodes · /: find · T: theme · Esc: clear",
                 findPh: "find node ( / )", routeAsk: "click the route's end node", noRoute: "no authored directed route" };
  var nodes = {}, edges = [];
  Array.prototype.forEach.call(canvas.querySelectorAll(".node[data-id]"), function (el) {
    nodes[el.dataset.id] = { el: el, id: el.dataset.id, name: (el.querySelector(".name") || {}).textContent || el.dataset.id,
      role: (el.querySelector(".role") || {}).textContent || "", group: el.dataset.group || "",
      sources: el.dataset.sources || "", note: el.dataset.note || "", out: [], inn: [] };
  });
  Array.prototype.forEach.call(canvas.querySelectorAll("svg.edges path[data-from][data-to]"), function (p) {
    var e = { el: p, from: p.dataset.from, to: p.dataset.to, kind: p.dataset.kind || "", label: null };
    var t = p.nextElementSibling;
    if (t && t.tagName.toLowerCase() === "text") e.label = t;
    if (nodes[e.from] && nodes[e.to]) { edges.push(e); nodes[e.from].out.push(e); nodes[e.to].inn.push(e); }
  });
  if (!edges.length && !Object.keys(nodes).length) return;
  var groupLabel = {};
  Array.prototype.forEach.call(canvas.querySelectorAll(".group[data-id]"), function (g) {
    groupLabel[g.dataset.id] = (g.querySelector(".g-label") || {}).textContent || g.dataset.id;
  });
  var toolbar = document.querySelector("[data-viewer-toolbar]"), passport = document.querySelector("[data-viewer-passport]");
  var find = toolbar && toolbar.querySelector("[data-viewer-find]"), themeBtn = toolbar && toolbar.querySelector("[data-viewer-theme]");
  var state = { focus: null, reach: null, route: null, routeStart: null };

  function clearClasses() {
    canvas.classList.remove("has-focus");
    Object.keys(nodes).forEach(function (k) { nodes[k].el.classList.remove("is-on", "is-focus"); });
    edges.forEach(function (e) { e.el.classList.remove("is-on"); if (e.label) e.label.classList.remove("is-on"); });
  }
  function on(id) { if (nodes[id]) nodes[id].el.classList.add("is-on"); }
  function onEdge(e) { e.el.classList.add("is-on"); if (e.label) e.label.classList.add("is-on"); }
  function reach(id, dir) {
    var seen = {}, stack = [id], result = { nodes: [], edges: [] };
    while (stack.length) {
      var cur = stack.pop(); if (seen[cur]) continue; seen[cur] = true; result.nodes.push(cur);
      (dir === "upstream" ? nodes[cur].inn : nodes[cur].out).forEach(function (e) {
        result.edges.push(e); stack.push(dir === "upstream" ? e.from : e.to);
      });
    }
    return result;
  }
  function route(a, b) {
    var prev = {}, queue = [a], seen = {}; seen[a] = true;
    while (queue.length) {
      var cur = queue.shift(); if (cur === b) break;
      nodes[cur].out.forEach(function (e) { if (!seen[e.to]) { seen[e.to] = true; prev[e.to] = e; queue.push(e.to); } });
    }
    if (!seen[b]) return null;
    var path = [], cur = b;
    while (cur !== a) { path.unshift(prev[cur]); cur = prev[cur].from; }
    return path;
  }
  function apply() {
    clearClasses();
    if (passport) passport.hidden = true;
    if (state.route) {
      var r = state.route;
      canvas.classList.add("has-focus");
      r.forEach(function (e) { onEdge(e); on(e.from); on(e.to); });
      nodes[r[0].from].el.classList.add("is-focus");
      showCard(nodes[r[0].from], r);
    } else if (state.focus && nodes[state.focus]) {
      var n = nodes[state.focus];
      canvas.classList.add("has-focus");
      n.el.classList.add("is-on", "is-focus");
      if (state.reach) {
        var rr = reach(n.id, state.reach);
        rr.nodes.forEach(on); rr.edges.forEach(onEdge);
      } else {
        n.out.concat(n.inn).forEach(function (e) { onEdge(e); on(e.from); on(e.to); });
      }
      showCard(n, null);
    }
    writeHash();
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function list(items, key) {
    if (!items.length) return "<dd>" + T.none + "</dd>";
    return "<dd>" + items.map(function (e) {
      var id = e[key]; return '<button type="button" data-go="' + esc(id) + '">' + esc(nodes[id].name) + "</button>";
    }).join(", ") + "</dd>";
  }
  function showCard(n, routePath) {
    if (!passport) return;
    var h = '<button type="button" class="close" aria-label="close">×</button><h3>' + esc(n.name) + "</h3>";
    if (n.role) h += '<div class="role">' + esc(n.role) + "</div>";
    h += "<dl>";
    if (routePath) {
      h += "<dt>" + T.route + "</dt><dd>" + routePath.map(function (e, i) { return (i === 0 ? esc(nodes[e.from].name) + " → " : "") + esc(nodes[e.to].name); }).join(" → ") + "</dd>";
    } else {
      h += "<dt>" + T.up + "</dt>" + list(n.inn, "from") + "<dt>" + T.down + "</dt>" + list(n.out, "to");
    }
    if (n.group) h += "<dt>" + T.group + "</dt><dd>" + esc(groupLabel[n.group] || n.group) + "</dd>";
    if (n.note) h += "<dt>" + T.note + "</dt><dd>" + esc(n.note) + "</dd>";
    if (n.sources) h += "<dt>" + T.sources + '</dt><dd class="sources">' + esc(n.sources) + "</dd>";
    h += "</dl>";
    if (!routePath) {
      h += '<div class="actions"><button type="button" data-reach="upstream" aria-pressed="' + (state.reach === "upstream") + '">' + T.reachUp + "</button>" +
           '<button type="button" data-reach="downstream" aria-pressed="' + (state.reach === "downstream") + '">' + T.reachDown + "</button>" +
           '<button type="button" data-copy>' + T.copy + "</button></div>";
    } else {
      h += '<div class="actions"><button type="button" data-copy>' + T.copy + "</button></div>";
    }
    passport.innerHTML = h;
    passport.hidden = false;
  }
  function writeHash() {
    var h = "";
    if (state.route) h = "#route=" + encodeURIComponent(state.route[0].from) + "~" + encodeURIComponent(state.route[state.route.length - 1].to);
    else if (state.focus) h = "#focus=" + encodeURIComponent(state.focus) + (state.reach ? "&reach=" + state.reach : "");
    if (history.replaceState) history.replaceState(null, "", location.pathname + location.search + h);
  }
  function readHash() {
    var h = location.hash.replace(/^#/, ""), params = {};
    h.split("&").forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
    state.focus = state.reach = state.route = null;
    if (params.route && params.route.indexOf("~") > 0) {
      var ab = params.route.split("~");
      if (nodes[ab[0]] && nodes[ab[1]]) { var r = route(ab[0], ab[1]); if (r && r.length) state.route = r; }
    } else if (params.focus && nodes[params.focus]) {
      state.focus = params.focus;
      if (params.reach === "upstream" || params.reach === "downstream") state.reach = params.reach;
    }
    apply();
  }
  function focusNode(id) {
    if (state.routeStart && state.routeStart !== id) {
      var r = route(state.routeStart, id);
      state.routeStart = null;
      if (r && r.length) { state.route = r; state.focus = null; apply(); return; }
      setHint(T.noRoute); 
    }
    state.route = null; state.focus = id; apply();
  }
  function setHint(text) { var el = toolbar && toolbar.querySelector("[data-viewer-hint]"); if (el) el.textContent = text; }
  function setTheme(dark) {
    if (dark) document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme");
    if (themeBtn) { themeBtn.setAttribute("aria-pressed", String(dark)); themeBtn.textContent = dark ? T.light : T.theme; }
    try { localStorage.setItem("arch-diagram-theme", dark ? "dark" : "light"); } catch (e) {}
  }

  Object.keys(nodes).forEach(function (k) {
    var el = nodes[k].el;
    el.setAttribute("tabindex", "0"); el.setAttribute("role", "button");
    el.addEventListener("click", function (ev) { ev.stopPropagation(); focusNode(k); });
    el.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); focusNode(k); } });
  });
  if (passport) passport.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    ev.stopPropagation();
    if (b.classList.contains("close")) { state.focus = state.route = state.reach = null; apply(); }
    else if (b.dataset.go) focusNode(b.dataset.go);
    else if (b.dataset.reach) { state.reach = state.reach === b.dataset.reach ? null : b.dataset.reach; apply(); }
    else if (b.hasAttribute("data-copy")) {
      var url = location.href;
      var done = function () { b.textContent = T.copied; setTimeout(function () { b.textContent = T.copy; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done); else done();
    }
  });
  document.addEventListener("click", function (ev) {
    if (passport && !passport.hidden && !passport.contains(ev.target) && !ev.target.closest(".node") && !ev.target.closest(".toolbar")) {
      state.focus = state.route = state.reach = null; apply();
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA")) {
      if (ev.key === "Escape") { ev.target.blur(); state.focus = state.route = state.reach = null; apply(); }
      return;
    }
    if (ev.key === "Escape") { state.focus = state.route = state.reach = state.routeStart = null; apply(); setHint(T.help); }
    else if (ev.key === "/" && find) { ev.preventDefault(); find.focus(); find.select(); }
    else if (ev.key === "t" || ev.key === "T") setTheme(!document.documentElement.hasAttribute("data-theme"));
    else if ((ev.key === "u" || ev.key === "U") && state.focus) { state.reach = state.reach === "upstream" ? null : "upstream"; apply(); }
    else if ((ev.key === "d" || ev.key === "D") && state.focus) { state.reach = state.reach === "downstream" ? null : "downstream"; apply(); }
    else if ((ev.key === "r" || ev.key === "R") && state.focus) { state.routeStart = state.focus; setHint(T.routeAsk); }
    else if (ev.key === "?") setHint(T.help);
  });
  if (find) {
    find.placeholder = T.findPh;
    find.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter") return;
      var q = find.value.trim().toLowerCase(); if (!q) return;
      var hit = Object.keys(nodes).filter(function (k) { return k.toLowerCase() === q || nodes[k].name.toLowerCase().indexOf(q) >= 0; })[0];
      if (hit) { focusNode(hit); nodes[hit].el.scrollIntoView({ block: "nearest", inline: "nearest" }); }
    });
  }
  if (toolbar) {
    toolbar.hidden = false;
    toolbar.querySelector("[data-viewer-clear]").textContent = T.clear;
    toolbar.querySelector("[data-viewer-clear]").addEventListener("click", function () { state.focus = state.route = state.reach = null; apply(); });
    if (themeBtn) themeBtn.addEventListener("click", function () { setTheme(!document.documentElement.hasAttribute("data-theme")); });
    setHint(T.help);
  }
  try {
    var saved = localStorage.getItem("arch-diagram-theme");
    if (saved === "dark" && !document.documentElement.hasAttribute("data-theme")) setTheme(true);
    else if (themeBtn) { themeBtn.textContent = document.documentElement.hasAttribute("data-theme") ? T.light : T.theme; themeBtn.setAttribute("aria-pressed", String(document.documentElement.hasAttribute("data-theme"))); }
  } catch (e) {}
  window.addEventListener("hashchange", readHash);
  readHash();
})();
</script>
</body>
</html>
